<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Annonces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { padding-top: 60px; }
        .filter-card { margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-gift"></i> Plateforme de Dons
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/annonces}">Annonces</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/annonces/new}">Créer une annonce</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recherches}">Mes recherches</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">
            <i class="bi bi-card-list"></i> Toutes les annonces
        </h1>

        <!-- Filters -->
        <div class="card filter-card">
            <div class="card-body">
                <form method="get" th:action="@{/annonces}">
                    <div class="row">
                        <div class="col-md-4">
                            <label for="zone" class="form-label">Zone géographique</label>
                            <input type="text" class="form-control" id="zone" name="zone" 
                                   th:value="${param.zone}" placeholder="Ex: Paris">
                        </div>
                        <div class="col-md-4">
                            <label for="etat" class="form-label">État</label>
                            <select class="form-select" id="etat" name="etat">
                                <option value="">Tous les états</option>
                                <option value="NEUF" th:selected="${param.etat == 'NEUF'}">Neuf</option>
                                <option value="BON_ETAT" th:selected="${param.etat == 'BON_ETAT'}">Bon état</option>
                                <option value="USAGE" th:selected="${param.etat == 'USAGE'}">Usagé</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="motcle" class="form-label">Mot-clé</label>
                            <input type="text" class="form-control" id="motcle" name="motcle" 
                                   th:value="${param.motcle}" placeholder="Ex: meuble">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search"></i> Rechercher
                        </button>
                        <a th:href="@{/annonces}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Réinitialiser
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Announcements List -->
        <div th:if="${annonces != null and !annonces.isEmpty()}">
            <p class="text-muted mb-3">
                <span th:text="${annonces.size()}">0</span> annonce(s) trouvée(s)
            </p>
            <div class="row">
                <div class="col-md-6 col-lg-4 mb-4" th:each="annonce : ${annonces}">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${annonce.titre}">Titre de l'annonce</h5>
                            <p class="card-text text-muted" th:text="${#strings.abbreviate(annonce.description, 120)}">
                                Description de l'annonce...
                            </p>
                            <div class="mb-2">
                                <span class="badge bg-success" th:text="${annonce.etat}">État</span>
                                <span class="badge bg-info" th:text="${annonce.modeLivraison}">Livraison</span>
                            </div>
                            <p class="text-muted mb-1">
                                <i class="bi bi-geo-alt"></i> 
                                <span th:text="${annonce.zoneGeographique}">Zone</span>
                            </p>
                            <p class="text-muted mb-3">
                                <i class="bi bi-calendar"></i> 
                                <span th:text="${#temporals.format(annonce.datePublication, 'dd/MM/yyyy HH:mm')}">Date</span>
                            </p>
                            <div class="d-flex gap-2">
                                <a th:href="@{/annonces/{id}(id=${annonce.id})}" class="btn btn-primary btn-sm flex-fill">
                                    <i class="bi bi-eye"></i> Voir
                                </a>
                                <button class="btn btn-outline-danger btn-sm" 
                                        th:onclick="'deleteAnnonce(' + ${annonce.id} + ')'">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${annonces == null or annonces.isEmpty()}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> Aucune annonce trouvée. 
            <a th:href="@{/annonces/new}">Créez la première !</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function deleteAnnonce(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette annonce ?')) {
                fetch('/api/annonces/' + id, {
                    method: 'DELETE'
                }).then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Erreur lors de la suppression');
                    }
                });
            }
        }
    </script>
</body>
</html>
