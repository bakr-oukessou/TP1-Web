<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
            margin: 0 auto 20px;
        }
        .profile-info {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .info-row {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: bold;
            color: #333;
            width: 200px;
        }
        .info-value {
            color: #666;
            flex: 1;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin: 10px 5px;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="navbar">
    <h2>📊 Mon Profil</h2>
    <a href="/home" style="color: white; text-decoration: none;">← Retour à l'accueil</a>
</div>

<div class="container">
    <div class="profile-header">
        <div class="avatar">👤</div>
        <h1 th:text="${name != null ? name : username}">User Name</h1>
        <p style="color: #666;" th:text="${email}">email@example.com</p>
    </div>

    <h2 style="margin-bottom: 20px;">Informations du compte</h2>

    <div class="profile-info">
        <div class="info-row">
            <div class="info-label">Nom d'utilisateur:</div>
            <div class="info-value" th:text="${username}">username</div>
        </div>
        <div class="info-row">
            <div class="info-label">Email:</div>
            <div class="info-value" th:text="${email}">email@example.com</div>
        </div>
        <div class="info-row" th:if="${name}">
            <div class="info-label">Nom complet:</div>
            <div class="info-value" th:text="${name}">Full Name</div>
        </div>
    </div>

    <h2 style="margin: 30px 0 20px 0;">Attributs du compte</h2>

    <div th:each="attr : ${attributes}" class="info-row">
        <div class="info-label" th:text="${attr.key}">Clé</div>
        <div class="info-value" th:text="${attr.value}">Valeur</div>
    </div>
